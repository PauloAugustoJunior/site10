<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<header>
  <div class="wrap bar">
    <a class="brand" href="#inicio" aria-label="Nexo, início" (click)="close()"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 27V5h6l12 14V5h6v22h-6L10 13v14z" fill="currentColor"/></svg><span>Nexo</span></a>
    <button #toggle type="button" class="toggle" [attr.aria-expanded]="open()" aria-controls="site-menu" [attr.aria-label]="open() ? 'Fechar menu' : 'Abrir menu'" (click)="open.set(!open())"><span>{{ open() ? 'Fechar' : 'Menu' }}</span><svg viewBox="0 0 24 24" aria-hidden="true">@if(open()){<path d="m6 6 12 12M18 6 6 18"/>}@else{<path d="M4 8h16M4 16h16"/>}</svg></button>
    <nav id="site-menu" aria-label="Navegação principal" [class.is-open]="open()">
      @for(link of links(); track link.href){<a [href]="link.href" (click)="close()">{{ link.label }}</a>}
      <a class="contact" href="#contato" (click)="close()">Planejar meu projeto</a>
    </nav>
  </div>
</header>
